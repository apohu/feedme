version: '3.8'

services:
  scraper:
    build: .
    container_name: real-estate-scraper
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/real_estate.db
    networks:
      - scraper-network

networks:
  scraper-network:
    driver: bridge
